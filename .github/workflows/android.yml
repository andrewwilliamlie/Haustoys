name: Android build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests and APK
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug
      # The PAX SDK jar is not in git, so this APK has no printer driver.
      # Build on your own machine with the jar in app/libs for a printing APK.
      - uses: actions/upload-artifact@v4
        with:
          name: haustoys-pos-debug-no-printer
          path: app/build/outputs/apk/debug/app-debug.apk
